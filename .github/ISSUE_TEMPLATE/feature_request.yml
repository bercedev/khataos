name: Feature request
description: Suggest something KhataOS should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/khataos/khataos/blob/main/docs/roadmap.md) and existing issues first. A missing or wrong tax rule? Use the **Tax rule** form.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should work, including the keys you'd expect to use.
    validations:
      required: true
  - type: dropdown
    id: country
    attributes:
      label: Country
      description: Only if it is about one country's rules or practice.
      options:
        - Not about one country
        - India
        - United Arab Emirates
        - Saudi Arabia
        - Singapore
        - United Kingdom
        - Germany
        - France
        - Netherlands
        - Spain
        - United States
        - Mexico
        - Another country
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it now
      description: A workaround, or how another tool handles it. Describe behaviour in your own words; don't paste screenshots or text from other products.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
