[package]
name = "khata-in"
description = "India compliance pack: GSTIN, place of supply, CGST/SGST/UTGST/IGST, Rule 46 numbering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
khata-compliance.workspace = true
khata-core.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
# IRP (e-invoice API) crypto, src/irp.rs: RSA PKCS#1 v1.5 for the auth
# payload, AES-256-ECB/PKCS7 for the session key and payloads, RS256 JWTs.
aes = "0.8"
base64 = "0.22.1"
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
sha2.workspace = true

[features]
# Test keys and RSA decrypt/sign helpers for a mock IRP (src/irp.rs `testing`).
test-support = []

[dev-dependencies]
rust_decimal_macros.workspace = true
