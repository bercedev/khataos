# Docs site for GitHub Pages, built by .github/workflows/docs.yml.
# Local preview:
#   python3 -m venv .venv && .venv/bin/pip install mkdocs-material==9.5.49
#   .venv/bin/mkdocs serve
site_name: "KhataOS: open source accounting"
site_description: "Free, open source accounting software that works offline: GST for India, VAT and ZATCA e-invoicing for the Gulf, UK Making Tax Digital, and a Tally alternative."
# site_url gives the site canonical links and a sitemap.xml once Pages is on.
site_url: https://khataos.github.io/khataos/
repo_url: https://github.com/khataos/khataos
repo_name: khataos/khataos
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
# Notes for maintainers, kept out of the published site.
exclude_docs: |
  seo-checklist.md
copyright: Copyright © 2026 the KhataOS contributors. AGPL-3.0-or-later.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

# Many pages link to source files outside docs/ (crates, apps). Those links
# work on GitHub but not on the site, so they are reported, not fatal.
validation:
  links:
    not_found: info
    unrecognized_links: info

