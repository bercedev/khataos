[package]
name = "khata-sync"
description = "Client side of KhataOS sync: fast-forward push and pull of the audit trail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hex.workspace = true
khata-core.workspace = true
khata-seal = { path = "../khata-seal" }
khata-store = { path = "../khata-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
axum = "0.8.9"
chrono.workspace = true
khata-import-tally = { path = "../khata-import-tally" }
khata-package = { path = "../khata-package" }
khata-server = { path = "../khata-server" }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
