[package]
name = "khata-sa"
description = "Saudi Arabia compliance pack: VAT number, regions, 15% VAT, ZATCA e-invoice XML, hash chain and QR, VAT return"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
khata-compliance.workspace = true
khata-core.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
sha2.workspace = true
base64 = "0.22.1"
# ECDSA on secp256k1 for the cryptographic stamp (research §6.3).
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
# The CSR (PKCS#10) for onboarding and reading the CSID certificate for the
# XAdES stamp (csr.rs, xades.rs). Same `der`/`spki` versions as k256.
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
# Wipes the PEM of the private key from memory after use.
zeroize = "1"
# The QR symbol itself (the TLV payload is built here).
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
rust_decimal_macros.workspace = true
serde_json.workspace = true
