[package]
name = "khata-import-tally"
description = "Import masters and vouchers from TallyPrime / Tally.ERP 9 XML exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Blocking client for Tally's XML-over-HTTP interface (localhost:9000).
http = ["dep:ureq"]

[dependencies]
khata-core.workspace = true
# GSTIN checks and state codes for party ledgers.
khata-in.workspace = true
chrono.workspace = true
quick-xml = "0.41"
rust_decimal.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, optional = true }

[dev-dependencies]
rust_decimal_macros.workspace = true
