[package]
name = "khata-mx"
description = "Mexico compliance pack: RFC with its check digit, the 32 federal entities, IVA 16/8/0%/exento, CFDI 4.0 XML with cadena original and CSD sello, and the monthly IVA summary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
khata-compliance.workspace = true
khata-core.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
sha2.workspace = true
base64 = "0.22.1"
# CSD sello: RSA PKCS#1 v1.5 over SHA-256 (Anexo 20). The SAT .key is an
# encrypted PKCS#8 DER file; pkcs5 adds the ciphers SAT keys use.
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "sha2", "pkcs5"] }
pkcs5 = { version = "0.7.1", features = ["3des", "sha1-insecure", "des-insecure"] }
# The CSD certificate (.cer, DER X.509): serial number = NoCertificado.
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[dev-dependencies]
rust_decimal_macros.workspace = true
serde_json.workspace = true
